# BACKEND
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend }
spec:
  replicas: 1
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      initContainers:
        # Ensures DBs are accepting connections before the backend starts
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432 && nc -z mongo 27017; do echo waiting for databases; sleep 2; done; echo "Waiting 10s for Mongo replica set to initialize..."; sleep 10;']
      containers:
        - name: backend
          image: bricked-lemons/backend:latest
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 5000 } ]
          envFrom: [ { configMapRef: { name: backend-env } } ]
---
apiVersion: v1
kind: Service
metadata: { name: backend }
spec:
  type: NodePort
  selector: { app: backend }
  ports: [ { port: 5000, targetPort: 5000, nodePort: {{BACKEND_NODE_PORT}} } ]
---
# FRONTEND
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: bricked-lemons/frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 5173 } ]
          envFrom: [ { configMapRef: { name: frontend-env } } ]
---
apiVersion: v1
kind: Service
metadata: { name: frontend }
spec:
  type: NodePort
  selector: { app: frontend }
  ports: [ { port: 5173, targetPort: 5173, nodePort: {{FRONTEND_NODE_PORT}} } ]